name: fansapi

x-php: &php
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: fansapi-php:local
  # Run as the host user so nothing written into the bind mount (vendor,
  # storage, built assets) ends up owned by root and undeletable.
  user: "${DOCKER_USER:-1000:1000}"
  environment:
    COMPOSER_HOME: /tmp/composer
    HOME: /tmp
  # No env_file: the PHP services read the bind-mounted .env themselves, so a
  # value generated during setup (APP_KEY) cannot be shadowed by a stale
  # environment variable captured when the container was created.
  volumes:
    - .:/var/www/html
  working_dir: /var/www/html
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    setup: { condition: service_completed_successfully }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fansapi
      MYSQL_USER: fansapi
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    ports: ["13306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: installs dependencies INTO the bind mount (so the mount cannot
  # hide them), builds assets, generates the key and runs migrations.
  setup:
    build: { context: ., dockerfile: docker/Dockerfile }
    image: fansapi-php:local
    user: "${DOCKER_USER:-1000:1000}"
    environment:
      COMPOSER_HOME: /tmp/composer
      HOME: /tmp
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      assets: { condition: service_completed_successfully }
    command: ["bash", "docker/setup.sh"]
    restart: "no"

  assets:
    image: node:22-bookworm-slim
    user: "${DOCKER_USER:-1000:1000}"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: ["bash", "-lc", "npm install --no-audit --no-fund && npm run build"]
    restart: "no"

  app:
    <<: *php
    command: ["php", "-d", "memory_limit=128M", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    environment:
      COMPOSER_HOME: /tmp/composer
      HOME: /tmp
      PHP_CLI_SERVER_WORKERS: "8"
    ports: ["127.0.0.1:8000:8000"]

  horizon:
    <<: *php
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 45s
    stop_signal: SIGTERM
    networks: [default, rulegen]

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 45s
    networks: [default, rulegen]

  # Private, concurrent fixture upstream used by the workload + tests.
  # PHP_CLI_SERVER_WORKERS makes it fork, so a slow account A response
  # cannot block account B.
  fixture:
    <<: *php
    depends_on:
      setup: { condition: service_completed_successfully }
    command: ["php", "-S", "0.0.0.0:9000", "-t", "fixture-server", "fixture-server/router.php"]
    environment:
      COMPOSER_HOME: /tmp/composer
      HOME: /tmp
      PHP_CLI_SERVER_WORKERS: "10"
    ports: ["127.0.0.1:9000:9000"]

  # Signing-rules extractor: the ONLY place downloaded OnlyFans JS runs, in a
  # killable child process. It is reachable only on the internal "rulegen"
  # network (by horizon and the scheduler), has internet egress on its own
  # network but no route to mysql/redis, no host port, no bind mount, no .env,
  # a read-only root, no capabilities and hard resource limits. It exposes two
  # fixed operations and accepts no URL, revision or code from callers.
  rulegen:
    build: { context: services/rulegen }
    image: fansapi-rulegen:local
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    networks: [rulegen, rulegen_egress]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  rulegen:
    internal: true
  rulegen_egress: {}

volumes:
  mysql-data:
  redis-data:
