name: fansapi

x-php: &php
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: fansapi-php:local
  # No env_file: the PHP services read the bind-mounted .env themselves, so a
  # value generated during setup (APP_KEY) cannot be shadowed by a stale
  # environment variable captured when the container was created.
  volumes:
    - .:/var/www/html
  working_dir: /var/www/html
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }
    setup: { condition: service_completed_successfully }

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fansapi
      MYSQL_USER: fansapi
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    ports: ["13306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: installs dependencies INTO the bind mount (so the mount cannot
  # hide them), builds assets, generates the key and runs migrations.
  setup:
    build: { context: ., dockerfile: docker/Dockerfile }
    image: fansapi-php:local
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      assets: { condition: service_completed_successfully }
    command: ["bash", "docker/setup.sh"]
    restart: "no"

  assets:
    image: node:22-bookworm-slim
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: ["bash", "-lc", "npm install --no-audit --no-fund && npm run build"]
    restart: "no"

  app:
    <<: *php
    command: ["php", "-d", "memory_limit=128M", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    environment:
      PHP_CLI_SERVER_WORKERS: "8"
    ports: ["127.0.0.1:8000:8000"]

  horizon:
    <<: *php
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 45s
    stop_signal: SIGTERM

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 45s

  # Private, concurrent fixture upstream used by the workload + tests.
  # PHP_CLI_SERVER_WORKERS makes it fork, so a slow account A response
  # cannot block account B.
  fixture:
    <<: *php
    depends_on:
      setup: { condition: service_completed_successfully }
    command: ["php", "-S", "0.0.0.0:9000", "-t", "fixture-server", "fixture-server/router.php"]
    environment:
      PHP_CLI_SERVER_WORKERS: "10"
    ports: ["127.0.0.1:9000:9000"]

volumes:
  mysql-data:
  redis-data:
